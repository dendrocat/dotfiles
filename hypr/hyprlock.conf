source = colors.conf

$font = Noto Sans

general {
    ignore_empty_input = true
}

background {
    monitor =

    path = $image

	blur_passes = 2
	blur_size   = 2
}

input-field {
    monitor = eDP-1

    size     = 500, 65
    position = 0, -60
    halign   = center
    valign   = center

    font_family = $font
    font_color  = $primary

	dots_size    = 0.35
	dots_spacing = 0.35

    inner_color       = $blur_primary_container
    outer_color       = $blur_primary
    outline_thickness = 2

    fade_on_empty = true
    fade_timeout  = 2000

    hide_input = false
    rounding   = 25

    check_color = $on_primary
    fail_color  = $error
    fail_text   = <i>$FAIL (<b>x$ATTEMPTS</b>)</i>
    placeholder_text =

    invert_numlock  = false
    swap_font_color = false

    shadow_passes = 5
    shadow_size   = 10
    shadow_color  = $shadow
}

# Clock
label {
    monitor = eDP-1

    position = 0, 270
    halign   = center
    valign   = center

    text  = cmd[update:1000] echo "$TIME"
    color = $primary

    font_size   = 160
    font_family = $font Bold

    shadow_passes = 5
    shadow_size   = 10
    shadow_color  = $shadow
}

# Date
label {
    monitor = eDP-1

    position = 0, 130
    halign   = center
    valign   = center

    text  = cmd[update:86400000] date +'%A, %-d %B %Y г.'
    color = $primary

    font_size   = 30
    font_family = $font Bold

    shadow_passes = 5
    shadow_size   = 5
    shadow_color  = $shadow
}

# Greeting
label {
    monitor = eDP-1

	position = 0, 50
	halign   = center
	valign   = center
	
	text  = С возвращением, $DESC
	color = $primary

	font_size   = 30
	font_family = $font Bold
}

# Input language
label {
    monitor = eDP-1

    position = 10, 10
    halign   = left
    valign   = bottom

    text  = $LAYOUT
    color = $primary

    font_size   = 24
    font_family = $font Bold

	onclick = hyprctl switchxkblayout all next

    shadow_passes = 5
    shadow_size   = 10
    shadow_color  = $shadow
}
